name: dailyquest_fixed
description: DailyQuest Flutter App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  get_storage: ^2.1.1
  supabase_flutter: ^2.9.1
  intl: ^0.18.1
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  mime: ^1.0.5
  uuid: ^4.3.3
  fl_chart: ^0.63.0
  cupertino_icons: ^1.0.6
  sign_in_with_apple: ^6.1.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.1.0  

flutter_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
